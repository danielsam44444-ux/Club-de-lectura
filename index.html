<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Nuestro Club del Libro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #F9E4E8;
    --blush-dark: #EFC5CC;
    --rose: #D4748A;
    --rose-deep: #A8506A;
    --sage: #C8D8C0;
    --sage-dark: #8FAF85;
    --cream: #FDF8F0;
    --warm-white: #FFFCF7;
    --text-dark: #3A2A2F;
    --text-mid: #6B4A55;
    --text-light: #9E7A84;
    --gold: #D4A853;
    --gold-light: #F0D5A0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background-color: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, var(--blush) 0%, #F5D5DC 50%, var(--blush) 100%);
    padding: 3rem 2rem 2.5rem;
    text-align: center;
    border-bottom: 2px solid var(--blush-dark);
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '📚';
    position: absolute;
    font-size: 120px;
    opacity: 0.07;
    top: -20px;
    left: -20px;
    transform: rotate(-15deg);
  }

  header::after {
    content: '🌸';
    position: absolute;
    font-size: 100px;
    opacity: 0.07;
    bottom: -10px;
    right: 10px;
    transform: rotate(10deg);
  }

  .header-badge {
    display: inline-block;
    background: var(--rose);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 1rem;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    color: var(--rose-deep);
    margin-bottom: 0.5rem;
  }

  header p {
    color: var(--text-mid);
    font-size: 1rem;
    font-weight: 300;
  }

  /* Nav reseñadoras */
  .readers-nav {
    background: white;
    border-bottom: 1px solid var(--blush-dark);
    padding: 0.8rem 2rem;
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(212,116,138,0.08);
  }

  .reader-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 30px;
    border: 1.5px solid var(--blush-dark);
    background: var(--warm-white);
    color: var(--text-mid);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
  }

  .reader-pill:hover, .reader-pill.active {
    background: var(--rose);
    border-color: var(--rose);
    color: white;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(212,116,138,0.25);
  }

  .reader-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: white;
  }

  /* Main layout */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem;
  }

  /* Botón añadir reseña */
  .add-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--rose);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 30px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin: 0 auto 2.5rem;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px rgba(212,116,138,0.3);
  }

  .add-btn:hover {
    background: var(--rose-deep);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(212,116,138,0.4);
  }

  /* Grid de reseñas */
  .reviews-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
  }

  /* Tarjeta de reseña */
  .review-card {
    background: white;
    border-radius: 20px;
    border: 1.5px solid var(--blush-dark);
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    position: relative;
  }

  .review-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(212,116,138,0.15);
  }

  .card-accent {
    height: 5px;
  }

  .card-body {
    padding: 1.3rem 1.4rem;
  }

  .card-reader {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0.9rem;
  }

  .card-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .reader-name {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .review-date {
    font-size: 0.75rem;
    color: var(--text-light);
    margin-left: auto;
  }

  .book-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--text-dark);
    margin-bottom: 0.3rem;
    line-height: 1.3;
  }

  .book-author {
    font-size: 0.82rem;
    color: var(--text-light);
    font-style: italic;
    margin-bottom: 0.8rem;
  }

  .stars {
    color: var(--gold);
    font-size: 1rem;
    letter-spacing: 2px;
    margin-bottom: 0.8rem;
  }

  .review-text {
    font-size: 0.88rem;
    color: var(--text-mid);
    line-height: 1.6;
    border-top: 1px dashed var(--blush-dark);
    padding-top: 0.8rem;
  }

  .card-tag {
    display: inline-block;
    background: var(--blush);
    color: var(--rose-deep);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
    margin-top: 0.8rem;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(58,42,47,0.45);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: var(--warm-white);
    border-radius: 24px;
    padding: 2rem;
    width: 100%;
    max-width: 480px;
    border: 1.5px solid var(--blush-dark);
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h2 {
    font-family: 'Playfair Display', serif;
    color: var(--rose-deep);
    font-size: 1.4rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  .form-group {
    margin-bottom: 1rem;
  }

  .form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--blush-dark);
    border-radius: 12px;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.2s;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--rose);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 100px;
  }

  .star-selector {
    display: flex;
    gap: 6px;
  }

  .star-selector span {
    font-size: 1.6rem;
    cursor: pointer;
    opacity: 0.3;
    transition: opacity 0.15s, transform 0.15s;
  }

  .star-selector span.lit {
    opacity: 1;
  }

  .star-selector span:hover {
    transform: scale(1.2);
  }

  .modal-footer {
    display: flex;
    gap: 10px;
    margin-top: 1.5rem;
  }

  .btn-cancel {
    flex: 1;
    padding: 10px;
    background: white;
    border: 1.5px solid var(--blush-dark);
    border-radius: 30px;
    color: var(--text-mid);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel:hover {
    background: var(--blush);
  }

  .btn-save {
    flex: 2;
    padding: 10px;
    background: var(--rose);
    border: none;
    border-radius: 30px;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(212,116,138,0.3);
  }

  .btn-save:hover {
    background: var(--rose-deep);
  }

  /* Delete button */
  .delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    opacity: 0.3;
    transition: opacity 0.2s;
    padding: 4px;
    line-height: 1;
  }

  .review-card:hover .delete-btn {
    opacity: 0.6;
  }

  .delete-btn:hover {
    opacity: 1 !important;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-light);
    grid-column: 1 / -1;
  }

  .empty-state .emoji {
    font-size: 3.5rem;
    margin-bottom: 1rem;
    display: block;
  }

  .empty-state h3 {
    font-family: 'Playfair Display', serif;
    color: var(--text-mid);
    margin-bottom: 0.5rem;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-light);
    font-size: 0.82rem;
    border-top: 1px solid var(--blush-dark);
    margin-top: 2rem;
  }

  /* Filter active */
  .hidden-card { display: none; }

  @media (max-width: 600px) {
    .readers-nav { gap: 0.4rem; padding: 0.6rem 1rem; }
    .reader-pill { font-size: 0.78rem; padding: 5px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-badge">📖 Club de lectura</div>
  <h1>Nuestro Rincón de Libros</h1>
  <p>Las reseñas más honestas, con todo el cariño ✨</p>
</header>

<nav class="readers-nav">
  <a class="reader-pill active" data-filter="all" href="#">
    <span>Todas</span>
  </a>
  <a class="reader-pill" data-filter="Dani" href="#">
    <span class="reader-avatar" style="background:#D4748A">D</span> Dani
  </a>
  <a class="reader-pill" data-filter="Elena" href="#">
    <span class="reader-avatar" style="background:#8FAF85">E</span> Elena
  </a>
  <a class="reader-pill" data-filter="María" href="#">
    <span class="reader-avatar" style="background:#D4A853">M</span> María
  </a>
  <a class="reader-pill" data-filter="Sandra" href="#">
    <span class="reader-avatar" style="background:#8CB8D4">S</span> Sandra
  </a>
  <a class="reader-pill" data-filter="Blanca" href="#">
    <span class="reader-avatar" style="background:#B48AC8">B</span> Blanca
  </a>
</nav>

<main>
  <button class="add-btn" onclick="openModal()">
    ✏️ Añadir reseña
  </button>

  <div class="reviews-grid" id="reviewsGrid">
    <!-- Las tarjetas se generan por JS -->
  </div>
</main>

<footer>
  Hecho con 💕 para nuestro club del libro
</footer>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>✨ Nueva reseña</h2>

    <div class="form-group">
      <label>¿Quién escribe?</label>
      <select id="fReader">
        <option value="">Selecciona...</option>
        <option value="Dani">Dani</option>
        <option value="Elena">Elena</option>
        <option value="María">María</option>
        <option value="Sandra">Sandra</option>
        <option value="Blanca">Blanca</option>
      </select>
    </div>

    <div class="form-group">
      <label>Título del libro</label>
      <input type="text" id="fTitle" placeholder="Ej: La casa de los espíritus">
    </div>

    <div class="form-group">
      <label>Autora / Autor</label>
      <input type="text" id="fAuthor" placeholder="Ej: Isabel Allende">
    </div>

    <div class="form-group">
      <label>Género</label>
      <input type="text" id="fGenre" placeholder="Ej: Novela histórica">
    </div>

    <div class="form-group">
      <label>Puntuación</label>
      <div class="star-selector" id="starSelector">
        <span data-v="1">⭐</span>
        <span data-v="2">⭐</span>
        <span data-v="3">⭐</span>
        <span data-v="4">⭐</span>
        <span data-v="5">⭐</span>
      </div>
    </div>

    <div class="form-group">
      <label>Tu reseña</label>
      <textarea id="fText" placeholder="Cuéntanos qué te ha parecido..."></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveReview()">Guardar reseña 💾</button>
    </div>
  </div>
</div>

<script>
const READERS = {
  Dani:   { color: '#D4748A', light: '#FAE0E5' },
  Elena:  { color: '#8FAF85', light: '#DCF0D8' },
  María:  { color: '#D4A853', light: '#F9ECCC' },
  Sandra: { color: '#8CB8D4', light: '#D8EDF6' },
  Blanca: { color: '#B48AC8', light: '#EDE0F5' },
};

const SAMPLE_REVIEWS = [
  {
    id: 1,
    reader: 'Dani',
    title: 'Mujeres que corren con los lobos',
    author: 'Clarissa Pinkola Estés',
    genre: 'Psicología',
    stars: 5,
    text: 'Un libro que te cambia por dentro. La Estés escribe sobre la mujer salvaje con una prosa casi poética. Lo recomiendo con todo mi corazón a cualquiera que busque reconectarse consigo misma.',
    date: 'Abril 2025'
  },
  {
    id: 2,
    reader: 'Elena',
    title: 'El problema de los tres cuerpos',
    author: 'Liu Cixin',
    genre: 'Ciencia ficción',
    stars: 4,
    text: 'Impresionante en su ambición. La física y la historia se entrelazan de forma brutal. Costó arrancar pero a mitad no podías soltar el libro. Ojo, es dura.',
    date: 'Marzo 2025'
  },
  {
    id: 3,
    reader: 'María',
    title: 'Normal People',
    author: 'Sally Rooney',
    genre: 'Ficción contemporánea',
    stars: 4,
    text: '¿Cómo puede algo tan sencillo doler tanto? Rooney captura la ansiedad de ser joven con una precisión que incomoda. Lo leí en dos días.',
    date: 'Febrero 2025'
  },
  {
    id: 4,
    reader: 'Sandra',
    title: 'Beloved',
    author: 'Toni Morrison',
    genre: 'Ficción histórica',
    stars: 5,
    text: 'Devastadora y necesaria. Morrison escribe sobre el trauma de la esclavitud de una manera que te deja sin palabras. Merece todo el premio Nobel y más.',
    date: 'Enero 2025'
  },
  {
    id: 5,
    reader: 'Blanca',
    title: 'Un cuarto propio',
    author: 'Virginia Woolf',
    genre: 'Ensayo',
    stars: 5,
    text: 'Cien años después y sigue siendo completamente actual. Un ensayo corto pero demoledor sobre creatividad, independencia y el espacio que las mujeres necesitan para crear.',
    date: 'Diciembre 2024'
  },
  {
    id: 6,
    reader: 'Dani',
    title: 'Nada',
    author: 'Carmen Laforet',
    genre: 'Novela',
    stars: 4,
    text: 'Una Barcelona de posguerra gris y asfixiante. Andrea es un personaje que se te queda dentro. Qué valiente Laforet al escribir esto con 23 años.',
    date: 'Noviembre 2024'
  },
];

let reviews = JSON.parse(localStorage.getItem('bookclub_reviews') || 'null') || SAMPLE_REVIEWS;
let nextId = Math.max(...reviews.map(r => r.id)) + 1;
let currentFilter = 'all';
let selectedStars = 0;

function saveToStorage() {
  localStorage.setItem('bookclub_reviews', JSON.stringify(reviews));
}

function starsHTML(n) {
  return '⭐'.repeat(n) + '☆'.repeat(5 - n);
}

function renderCards() {
  const grid = document.getElementById('reviewsGrid');
  const filtered = currentFilter === 'all' ? reviews : reviews.filter(r => r.reader === currentFilter);

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <span class="emoji">📚</span>
      <h3>Todavía no hay reseñas aquí</h3>
      <p>¡Sé la primera en añadir una!</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const rd = READERS[r.reader] || { color: '#ccc', light: '#f5f5f5' };
    return `<div class="review-card" data-id="${r.id}">
      <button class="delete-btn" onclick="deleteReview(${r.id})" title="Borrar">✕</button>
      <div class="card-accent" style="background: linear-gradient(90deg, ${rd.color}, ${rd.light})"></div>
      <div class="card-body">
        <div class="card-reader">
          <div class="card-avatar" style="background:${rd.color}">${r.reader[0]}</div>
          <span class="reader-name">${r.reader}</span>
          <span class="review-date">${r.date}</span>
        </div>
        <h3 class="book-title">${r.title}</h3>
        <p class="book-author">— ${r.author}</p>
        <div class="stars">${starsHTML(r.stars)}</div>
        <p class="review-text">${r.text}</p>
        ${r.genre ? `<span class="card-tag">${r.genre}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  selectedStars = 0;
  updateStars();
  document.getElementById('fReader').value = '';
  document.getElementById('fTitle').value = '';
  document.getElementById('fAuthor').value = '';
  document.getElementById('fGenre').value = '';
  document.getElementById('fText').value = '';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function updateStars() {
  document.querySelectorAll('#starSelector span').forEach((s, i) => {
    s.classList.toggle('lit', i < selectedStars);
  });
}

document.querySelectorAll('#starSelector span').forEach(s => {
  s.addEventListener('click', () => {
    selectedStars = parseInt(s.dataset.v);
    updateStars();
  });
  s.addEventListener('mouseenter', () => {
    document.querySelectorAll('#starSelector span').forEach((el, i) => {
      el.classList.toggle('lit', i < parseInt(s.dataset.v));
    });
  });
  s.parentElement.addEventListener('mouseleave', () => updateStars());
});

function saveReview() {
  const reader = document.getElementById('fReader').value;
  const title = document.getElementById('fTitle').value.trim();
  const author = document.getElementById('fAuthor').value.trim();
  const genre = document.getElementById('fGenre').value.trim();
  const text = document.getElementById('fText').value.trim();

  if (!reader || !title || !author || !text || selectedStars === 0) {
    alert('Por favor rellena todos los campos y elige una puntuación ⭐');
    return;
  }

  const now = new Date();
  const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const date = `${months[now.getMonth()]} ${now.getFullYear()}`;

  reviews.unshift({ id: nextId++, reader, title, author, genre, stars: selectedStars, text, date });
  saveToStorage();
  renderCards();
  closeModal();
}

function deleteReview(id) {
  if (!confirm('¿Borrar esta reseña?')) return;
  reviews = reviews.filter(r => r.id !== id);
  saveToStorage();
  renderCards();
}

document.querySelectorAll('.reader-pill').forEach(pill => {
  pill.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('.reader-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentFilter = pill.dataset.filter;
    renderCards();
  });
});

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

renderCards();
</script>
</body>
</html>
