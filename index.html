<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miscelánea</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #0a0a0a;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 18px;
    line-height: 1.65;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }

  /* Layout */
  .site-header {
    border-bottom: 1px solid #0a0a0a;
    padding: 2.5rem 3rem 1.5rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 2rem;
  }

  .site-title {
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .site-subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: #888;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  /* Nav filtro */
  .filter-bar {
    border-bottom: 1px solid #e0e0e0;
    padding: 0 3rem;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 0.9rem 1.2rem 0.7rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
    cursor: pointer;
    white-space: nowrap;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }

  .filter-btn:hover { color: #0a0a0a; }

  .filter-btn.active {
    color: #0a0a0a;
    border-bottom-color: #0a0a0a;
  }

  /* Main */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 3rem 3rem 5rem;
  }

  /* Botón añadir */
  .add-btn {
    background: none;
    border: 1px solid #0a0a0a;
    padding: 6px 18px;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .add-btn:hover {
    background: #0a0a0a;
    color: #fff;
  }

  /* Lista de reseñas */
  .reviews-list {
    margin-top: 0;
  }

  .review-item {
    border-bottom: 1px solid #e8e8e8;
    padding: 2.5rem 0;
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 2rem;
    align-start: start;
  }

  .review-item:first-child {
    border-top: 1px solid #e8e8e8;
  }

  .review-meta {
    padding-top: 0.2rem;
  }

  .meta-reader {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #0a0a0a;
    margin-bottom: 0.4rem;
  }

  .meta-date {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    font-weight: 300;
    color: #aaa;
    margin-bottom: 0.8rem;
  }

  .meta-stars {
    font-size: 0.75rem;
    letter-spacing: 2px;
    color: #0a0a0a;
  }

  .meta-genre {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: #aaa;
    text-transform: uppercase;
    margin-top: 0.6rem;
    border-top: 1px solid #e8e8e8;
    padding-top: 0.6rem;
  }

  .review-body {}

  .book-title {
    font-size: 1.5rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 0.15rem;
  }

  .book-author {
    font-size: 0.95rem;
    font-style: italic;
    color: #666;
    margin-bottom: 1.1rem;
  }

  .review-text {
    font-size: 1rem;
    color: #333;
    line-height: 1.7;
  }

  .delete-btn {
    float: right;
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: #ccc;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: color 0.15s;
    padding: 2px 0;
    margin-top: 0.2rem;
  }

  .delete-btn:hover { color: #0a0a0a; }

  /* Empty state */
  .empty-state {
    padding: 5rem 0;
    color: #bbb;
    font-style: italic;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.92);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    border: 1px solid #0a0a0a;
    padding: 2.5rem;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-title {
    font-size: 1.3rem;
    font-weight: 400;
    margin-bottom: 2rem;
    letter-spacing: -0.01em;
  }

  .form-row {
    margin-bottom: 1.2rem;
  }

  .form-row label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 5px;
  }

  .form-row input,
  .form-row select,
  .form-row textarea {
    width: 100%;
    border: none;
    border-bottom: 1px solid #ccc;
    padding: 6px 0;
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    color: #0a0a0a;
    background: transparent;
    outline: none;
    transition: border-color 0.15s;
    border-radius: 0;
  }

  .form-row input:focus,
  .form-row select:focus,
  .form-row textarea:focus {
    border-bottom-color: #0a0a0a;
  }

  .form-row textarea {
    resize: vertical;
    min-height: 90px;
  }

  .star-pick {
    display: flex;
    gap: 8px;
    padding: 4px 0;
  }

  .star-pick span {
    font-size: 1.2rem;
    cursor: pointer;
    opacity: 0.2;
    transition: opacity 0.12s;
    line-height: 1;
  }

  .star-pick span.lit { opacity: 1; }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #e0e0e0;
  }

  .btn-cancel-modal {
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #aaa;
    cursor: pointer;
    transition: color 0.15s;
  }

  .btn-cancel-modal:hover { color: #0a0a0a; }

  .btn-save-modal {
    background: #0a0a0a;
    border: 1px solid #0a0a0a;
    color: #fff;
    padding: 8px 24px;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .btn-save-modal:hover {
    background: #fff;
    color: #0a0a0a;
  }

  /* Count */
  .review-count {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    font-weight: 300;
    color: #aaa;
    letter-spacing: 0.06em;
    margin-bottom: 0;
    display: block;
    text-align: right;
    margin-bottom: -1px;
    padding-bottom: 0.8rem;
  }

  footer {
    border-top: 1px solid #e0e0e0;
    padding: 1.5rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-name {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #bbb;
  }

  @media (max-width: 640px) {
    .site-header { padding: 1.5rem 1.5rem 1rem; flex-wrap: wrap; gap: 1rem; }
    .filter-bar { padding: 0 1.5rem; }
    main { padding: 2rem 1.5rem 4rem; }
    .review-item { grid-template-columns: 1fr; gap: 0.5rem; }
    .review-meta { display: flex; gap: 1.5rem; align-items: baseline; flex-wrap: wrap; }
    .meta-genre { border-top: none; padding-top: 0; margin-top: 0; }
    footer { padding: 1.5rem; }
    .modal { padding: 1.5rem; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div>
    <h1 class="site-title">Miscelánea</h1>
    <p class="site-subtitle">Reseñas de libros</p>
  </div>
  <div class="header-right">
    <button class="add-btn" onclick="openModal()">+ Nueva reseña</button>
  </div>
</header>

<nav class="filter-bar">
  <button class="filter-btn active" data-filter="all">Todas</button>
  <button class="filter-btn" data-filter="Dani">Dani</button>
  <button class="filter-btn" data-filter="Elena">Elena</button>
  <button class="filter-btn" data-filter="María">María</button>
  <button class="filter-btn" data-filter="Sandra">Sandra</button>
  <button class="filter-btn" data-filter="Blanca">Blanca</button>
</nav>

<main>
  <span class="review-count" id="reviewCount"></span>
  <div class="reviews-list" id="reviewsList"></div>
</main>

<footer>
  <span class="footer-name">Miscelánea</span>
  <span class="footer-name" id="footerYear"></span>
</footer>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 class="modal-title">Nueva reseña</h2>

    <div class="form-row">
      <label>Reseñadora</label>
      <select id="fReader">
        <option value="">—</option>
        <option>Dani</option>
        <option>Elena</option>
        <option>María</option>
        <option>Sandra</option>
        <option>Blanca</option>
      </select>
    </div>

    <div class="form-row">
      <label>Título</label>
      <input type="text" id="fTitle" placeholder="Título del libro">
    </div>

    <div class="form-row">
      <label>Autora / Autor</label>
      <input type="text" id="fAuthor" placeholder="">
    </div>

    <div class="form-row">
      <label>Género</label>
      <input type="text" id="fGenre" placeholder="">
    </div>

    <div class="form-row">
      <label>Puntuación</label>
      <div class="star-pick" id="starPick">
        <span data-v="1">★</span>
        <span data-v="2">★</span>
        <span data-v="3">★</span>
        <span data-v="4">★</span>
        <span data-v="5">★</span>
      </div>
    </div>

    <div class="form-row">
      <label>Reseña</label>
      <textarea id="fText" placeholder="Escribe tu opinión..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel-modal" onclick="closeModal()">Cancelar</button>
      <button class="btn-save-modal" onclick="saveReview()">Guardar</button>
    </div>
  </div>
</div>

<script>
document.getElementById('footerYear').textContent = new Date().getFullYear();

const SAMPLE = [
  { id:1, reader:'Dani', title:'Mujeres que corren con los lobos', author:'Clarissa Pinkola Estés', genre:'Psicología', stars:5, text:'Un libro que te cambia por dentro. La Estés escribe sobre la mujer salvaje con una prosa casi poética. Imprescindible.', date:'Abril 2025' },
  { id:2, reader:'Elena', title:'El problema de los tres cuerpos', author:'Liu Cixin', genre:'Ciencia ficción', stars:4, text:'Impresionante en su ambición. La física y la historia se entrelazan de forma brutal. Costó arrancar pero a mitad no podías soltarlo.', date:'Marzo 2025' },
  { id:3, reader:'María', title:'Normal People', author:'Sally Rooney', genre:'Ficción contemporánea', stars:4, text:'¿Cómo puede algo tan sencillo doler tanto? Rooney captura la ansiedad de ser joven con una precisión que incomoda.', date:'Febrero 2025' },
  { id:4, reader:'Sandra', title:'Beloved', author:'Toni Morrison', genre:'Ficción histórica', stars:5, text:'Devastadora y necesaria. Morrison escribe sobre el trauma de la esclavitud de una manera que te deja sin palabras.', date:'Enero 2025' },
  { id:5, reader:'Blanca', title:'Un cuarto propio', author:'Virginia Woolf', genre:'Ensayo', stars:5, text:'Cien años después y sigue siendo completamente actual. Un ensayo corto pero demoledor.', date:'Diciembre 2024' },
  { id:6, reader:'Dani', title:'Nada', author:'Carmen Laforet', genre:'Novela', stars:4, text:'Una Barcelona de posguerra gris y asfixiante. Andrea es un personaje que se te queda dentro. Qué valiente Laforet al escribir esto con 23 años.', date:'Noviembre 2024' },
];

let reviews = JSON.parse(localStorage.getItem('miscelanea_reviews') || 'null') || SAMPLE;
let nextId = Math.max(...reviews.map(r => r.id), 0) + 1;
let filter = 'all';
let stars = 0;

function starsStr(n) {
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function render() {
  const list = document.getElementById('reviewsList');
  const countEl = document.getElementById('reviewCount');
  const shown = filter === 'all' ? reviews : reviews.filter(r => r.reader === filter);

  countEl.textContent = shown.length + (shown.length === 1 ? ' reseña' : ' reseñas');

  if (!shown.length) {
    list.innerHTML = '<p class="empty-state">Ninguna reseña todavía.</p>';
    return;
  }

  list.innerHTML = shown.map(r => `
    <div class="review-item" data-id="${r.id}">
      <div class="review-meta">
        <div class="meta-reader">${r.reader}</div>
        <div class="meta-date">${r.date}</div>
        <div class="meta-stars">${starsStr(r.stars)}</div>
        ${r.genre ? `<div class="meta-genre">${r.genre}</div>` : ''}
      </div>
      <div class="review-body">
        <button class="delete-btn" onclick="del(${r.id})">eliminar</button>
        <h2 class="book-title">${r.title}</h2>
        <p class="book-author">${r.author}</p>
        <p class="review-text">${r.text}</p>
      </div>
    </div>
  `).join('');
}

function del(id) {
  if (!confirm('¿Eliminar esta reseña?')) return;
  reviews = reviews.filter(r => r.id !== id);
  localStorage.setItem('miscelanea_reviews', JSON.stringify(reviews));
  render();
}

// Filtros
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});

// Modal
function openModal() {
  stars = 0;
  updateStars();
  ['fReader','fTitle','fAuthor','fGenre','fText'].forEach(id => {
    const el = document.getElementById(id);
    el.tagName === 'SELECT' ? (el.value = '') : (el.value = '');
  });
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function updateStars() {
  document.querySelectorAll('#starPick span').forEach((s, i) => {
    s.classList.toggle('lit', i < stars);
  });
}

document.querySelectorAll('#starPick span').forEach(s => {
  s.addEventListener('click', () => { stars = +s.dataset.v; updateStars(); });
  s.addEventListener('mouseenter', () => {
    document.querySelectorAll('#starPick span').forEach((el, i) => el.classList.toggle('lit', i < +s.dataset.v));
  });
  document.getElementById('starPick').addEventListener('mouseleave', updateStars);
});

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

function saveReview() {
  const reader = document.getElementById('fReader').value;
  const title  = document.getElementById('fTitle').value.trim();
  const author = document.getElementById('fAuthor').value.trim();
  const genre  = document.getElementById('fGenre').value.trim();
  const text   = document.getElementById('fText').value.trim();

  if (!reader || !title || !author || !text || !stars) {
    alert('Por favor completa todos los campos y elige una puntuación.');
    return;
  }

  const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const now = new Date();
  reviews.unshift({ id: nextId++, reader, title, author, genre, stars, text, date: `${months[now.getMonth()]} ${now.getFullYear()}` });
  localStorage.setItem('miscelanea_reviews', JSON.stringify(reviews));
  render();
  closeModal();
}

render();
</script>
</body>
</html>
